name: Dynamic Sharded Server Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '1. 目标地址 (HTTP模式填URL, TCP/UDP填 IP:端口)'
        required: true
        default: 'https://example.com'
      protocol_type:
        description: '2. 选择测试协议类型 (选项卡)'
        required: true
        default: 'http'
        type: choice
        options:
          - http
          - tcp
          - udp
      threads_per_shard:
        description: '3. 每个分片的请求线程数'
        required: true
        default: '100'
      shard_count:
        description: '4. 分片数量 (将启动对应数量的虚拟机)'
        required: true
        default: '15'
      run_time_minutes:
        description: '5. 请求时间 (单位: 分钟)'
        required: true
        default: '5'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_array: ${{ steps.set-matrix.outputs.matrix_array }}
    steps:
      - id: set-matrix
        run: |
          SHARD_COUNT=${{ github.event.inputs.shard_count }}
          JSON_ARRAY=$(python3 -c "import json; print(json.dumps(list(range(1, $SHARD_COUNT + 1))))")
          echo "matrix_array=$JSON_ARRAY" >> $GITHUB_OUTPUT

  flood-attack:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-matrix.outputs.matrix_array) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Locust
        run: pip install locust==2.32.2 requests

      - name: Fire Requests - Shard ${{ matrix.shard }}
        run: |
          # 将 GitHub 选项卡中选择的协议通过环境变量传递给 python 脚本
          export PROTOCOL="${{ github.event.inputs.protocol_type }}"
          
          locust -f 1.py \
            --headless \
            -u ${{ github.event.inputs.threads_per_shard }} \
            -r ${{ github.event.inputs.threads_per_shard }} \
            --run-time ${{ github.event.inputs.run_time_minutes }}m \
            --host "${{ github.event.inputs.target_url }}"
