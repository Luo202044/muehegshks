name: CVE-2026-49975 Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://example.com'
      threads_per_shard:
        description: 'Threads per shard'
        required: true
        default: '100'
      shard_count:
        description: 'Shard count'
        required: true
        default: '15'
      run_time_minutes:
        description: 'Run time (minutes)'
        required: true
        default: '5'
      hpack_references:
        description: 'HPACK references'
        required: false
        default: '2048'
      hold_seconds:
        description: 'Hold seconds'
        required: false
        default: '15'
      proxy_url:
        description: 'Proxy URL (empty for direct)'
        required: false
        default: ''

