name: Ultimate Go Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '1. 目标 URL (例如: https://api.yourdomain.com)'
        required: true
        default: 'https://example.com'
      threads_per_shard:
        description: '2. 每个分片的并发 Goroutine 数'
        required: true
        default: '200'
      shard_count:
        description: '3. 分片数量 (将启动对应数量的虚拟机)'
        required: true
        default: '15'
      run_time_minutes:
        description: '4. 请求时间 (单位: 分钟)'
        required: true
        default: '5'

jobs:
  # 任务一：动态生成矩阵数组 (逻辑不变)
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_array: ${{ steps.set-matrix.outputs.matrix_array }}
    steps:
      - id: set-matrix
        run: |
          SHARD_COUNT=${{ github.event.inputs.shard_count }}
          JSON_ARRAY=$(python3 -c "import json; print(json.dumps(list(range(1, $SHARD_COUNT + 1))))")
          echo "matrix_array=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # 任务二：运行 Go 语言洪流攻击
  flood-attack:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-matrix.outputs.matrix_array) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 使用现代 Go 版本

      - name: Fire Requests with Go - Shard ${{ matrix.shard }}
        run: |
          # 直接运行 Go 脚本，传入 4 个自定义参数
          go run main.go \
            -url ${{ github.event.inputs.target_url }} \
            -c ${{ github.event.inputs.threads_per_shard }} \
            -t ${{ github.event.inputs.run_time_minutes }}
